name: Build Nuitka Modules

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: network-windows-binaries
          - os: ubuntu-latest
            artifact: network-linux-so

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install nuitka
          python -m pip install cryptography argon2-cffi numpy pyzmq blake3 tornado

      - name: Build modules (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 1. Build Encryption as its own independent module
          python -m nuitka `
            --module `
            --output-dir=dist `
            Encryption.py

          # 2. Build network with Encryption embedded
          python -m nuitka `
            --module `
            --include-module=Encryption `
            --include-module=util `
            --output-dir=dist `
            --enable-plugin=tk-inter `
            --lto=yes `
            network.py

          # 3. Duplicate all .pyd files as .dll files for other languages
          Get-ChildItem -Path dist/*.pyd | ForEach-Object {
              Copy-Item $_.FullName -Destination ($_.FullName -replace '\.pyd$', '.dll')
          }

      - name: Build modules (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Build Encryption standalone
          python -m nuitka \
            --module \
            --output-dir=dist \
            Encryption.py

          # Build network with Encryption embedded
          python -m nuitka \
            --module \
            --include-module=Encryption \
            --include-module=util \
            --output-dir=dist \
            --lto=yes \
            network.py

      - name: Upload Windows Artifacts (.pyd & .dll only)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.pyd
            dist/*.dll

      - name: Upload Linux Artifacts (.so only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.so
