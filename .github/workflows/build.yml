name: Build Nuitka DLL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install nuitka
          pip install cryptography argon2-cffi numpy

      - name: Build network.py as DLL
        run: |
          python -m nuitka `
            --module `
            --include-module=Encryption `
            --include-module=util `
            --include-package=cryptography `
            --include-package=argon2 `
            --include-package=numpy `
            --output-dir=dist `
            network.py

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: network-dll
          path: dist/*
