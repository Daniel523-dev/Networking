```yaml
name: Build Nuitka Modules

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: network-windows-pyd
          - os: ubuntu-latest
            artifact: network-linux-so

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install nuitka
          python -m pip install cryptography argon2-cffi numpy

      - name: Build network.py
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka `
            --module `
            --include-module=Encryption `
            --include-module=util `
            --include-package=cryptography `
            --include-package=argon2 `
            --output-dir=dist `
            network.py

      - name: Build network.py
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m nuitka \
            --module \
            --include-module=Encryption \
            --include-module=util \
            --include-package=cryptography \
            --include-package=argon2 \
            --output-dir=dist \
            network.py

      - name: Upload Windows .pyd
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.pyd

      - name: Upload Linux shared library
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.so
```
